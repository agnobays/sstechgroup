<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05121F"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="880" fill="url(#bgGrad)"/>

  <!-- Top Nav Header -->
  <g transform="translate(60, 40)">
    <rect width="1160" height="76" rx="16" fill="#0A2540" stroke="#1E3A5F" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="16" width="44" height="44" rx="10" fill="url(#goldGrad)"/>
    <text x="42" y="47" font-family="DM Serif Display, Georgia, serif" font-size="26" font-weight="bold" fill="#0A2540" text-anchor="middle">Q</text>
    <text x="76" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1">QHAWE</text>
    <text x="156" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#D97706" letter-spacing="2">CREDIT SOLUTIONS</text>
    <text x="76" y="54" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Automated Micro-Lending &bull; NCR Registered Provider</text>

    <rect x="910" y="18" width="230" height="40" rx="10" fill="#05101A" stroke="#10B981" stroke-width="1"/>
    <circle cx="928" cy="38" r="4" fill="#10B981"/>
    <text x="940" y="42" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" fill="#10B981">Loan Approved &bull; Ready</text>
  </g>

  <!-- Step Progress Bar (All Completed) -->
  <g transform="translate(60, 136)">
    <rect width="1160" height="48" rx="12" fill="#0A2540" stroke="#1E3A5F" stroke-width="1"/>
    
    <circle cx="40" cy="24" r="12" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
    <text x="40" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#10B981" text-anchor="middle">&check;</text>
    <text x="60" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="#10B981">1. Amount: R2,500</text>

    <line x1="240" y1="24" x2="310" y2="24" stroke="#10B981" stroke-width="2"/>

    <circle cx="340" cy="24" r="12" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
    <text x="340" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#10B981" text-anchor="middle">&check;</text>
    <text x="360" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="#10B981">2. ID Verified</text>

    <line x1="490" y1="24" x2="560" y2="24" stroke="#10B981" stroke-width="2"/>

    <circle cx="590" cy="24" r="12" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
    <text x="590" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#10B981" text-anchor="middle">&check;</text>
    <text x="610" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="#10B981">3. Bank Verified</text>

    <line x1="750" y1="24" x2="820" y2="24" stroke="#10B981" stroke-width="2"/>

    <circle cx="850" cy="24" r="12" fill="#D97706"/>
    <text x="850" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#0A2540" text-anchor="middle">4</text>
    <text x="870" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#D97706">4. Sign &amp; RTC Payout</text>
  </g>

  <!-- Step 4 Approval & Payout Card -->
  <g transform="translate(240, 220)">
    <rect width="800" height="600" rx="20" fill="#0A2540" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>

    <g transform="translate(50, 40)">
      <!-- Success Badge -->
      <circle cx="350" cy="40" r="32" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2"/>
      <text x="350" y="49" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="bold" fill="#10B981" text-anchor="middle">&check;</text>

      <text x="350" y="105" font-family="DM Serif Display, Georgia, serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Congratulations, Sindiwe!</text>
      <text x="350" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Your micro-loan of R 2,500 has been approved and is ready for immediate payout.</text>

      <!-- Contract Agreement Summary Box -->
      <g transform="translate(50, 155)">
        <rect width="600" height="180" rx="14" fill="#05101A" stroke="#1E3A5F" stroke-width="1"/>

        <g transform="translate(30, 25)">
          <text x="0" y="16" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Approved Principal:</text>
          <text x="540" y="16" font-family="JetBrains Mono, monospace" font-size="18" font-weight="bold" fill="#D97706" text-anchor="end">R 2,500.00</text>

          <text x="0" y="48" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94A3B8">Disbursement Bank Account:</text>
          <text x="540" y="48" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="semibold" fill="#FFFFFF" text-anchor="end">Capitec Bank &bull;&bull;&bull;&bull; 8087</text>

          <text x="0" y="80" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94A3B8">Repayment Date &amp; Total:</text>
          <text x="540" y="80" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">25 Nov 2026 (R 3,037.50)</text>

          <text x="0" y="112" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94A3B8">DebiCheck Mandate Status:</text>
          <text x="540" y="112" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" fill="#10B981" text-anchor="end">&check; Prompt sent to Capitec App</text>
        </g>
      </g>

      <!-- Digital Signature Checkbox & OTP -->
      <g transform="translate(50, 360)">
        <rect width="600" height="70" rx="12" fill="#05101A" stroke="#1E3A5F" stroke-width="1"/>
        <rect x="20" y="24" width="22" height="22" rx="6" fill="#10B981"/>
        <text x="31" y="39" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" fill="#0A2540" text-anchor="middle">&check;</text>
        
        <text x="55" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">I accept the NCA Form 20.1 pre-agreement statement and terms.</text>
        <text x="55" y="50" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94A3B8">OTP authentication code #4829 has been verified to mobile 079 910 9392.</text>
      </g>

      <!-- Big RTC Payout Button -->
      <g transform="translate(50, 460)">
        <rect width="600" height="56" rx="14" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
        <text x="300" y="34" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">DISBURSE R 2,500 VIA REAL-TIME CLEARING (RTC) NOW &rarr;</text>
      </g>
    </g>
  </g>
</svg>
