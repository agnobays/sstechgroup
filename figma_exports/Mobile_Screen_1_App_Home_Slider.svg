        <rect width="310" height="52" rx="14" fill="url(#gold1)"/>
        <text x="155" y="31" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#0A2540" text-anchor="middle">APPLY FOR R 2,500 NOW &rarr;</text>
