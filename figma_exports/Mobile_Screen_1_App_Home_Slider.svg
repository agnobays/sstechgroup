    <text x="18" y="25" font-family="DM Serif Display, Georgia, serif" font-size="20" font-weight="bold" fill="#0A2540" text-anchor="middle">Q</text>
    <text x="46" y="20" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">QHAWE</text>
    <text x="46" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="700" fill="#D97706" letter-spacing="1">CREDIT SOLUTIONS</text>

