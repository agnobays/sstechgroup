          <path d="M8 12L11 15L16 9" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
          <text x="12" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Status</text>
        </g>

        <!-- Support WhatsApp -->
        <g transform="translate(228, 16)">
          <circle cx="12" cy="12" r="8" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
          <path d="M12 9V13H15" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
          <text x="12" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Support</text>
        </g>

        <!-- Profile -->
