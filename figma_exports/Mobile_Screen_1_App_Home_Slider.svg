        <text x="48" y="36" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">30 Days</text>

        <rect x="106" y="0" width="96" height="44" rx="10" fill="#0A2540" stroke="#1E3A5F" stroke-width="1"/>
        <text x="154" y="22" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">2 Months</text>
        <text x="154" y="36" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">60 Days</text>

        <rect x="214" y="0" width="96" height="44" rx="10" fill="#0A2540" stroke="#1E3A5F" stroke-width="1"/>
        <text x="262" y="22" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">3 Months</text>
        <text x="262" y="36" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">90 Days</text>
