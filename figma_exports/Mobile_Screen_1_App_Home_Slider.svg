          <text x="282" y="36" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="end">R 194.00</text>

          <line x1="0" y1="50" x2="282" y2="50" stroke="#1E3A5F" stroke-width="1"/>

          <text x="0" y="70" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Total Repayable:</text>
          <text x="282" y="70" font-family="JetBrains Mono, monospace" font-size="16" font-weight="bold" fill="#D97706" text-anchor="end">R 3,037.50</text>
        </g>
      </g>

      <!-- Native Call to Action -->
