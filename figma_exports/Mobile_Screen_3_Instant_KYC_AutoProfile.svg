<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="mBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05121F"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" rx="44" fill="url(#mBg3)"/>
  <rect width="390" height="844" rx="44" fill="none" stroke="#1E3A5F" stroke-width="3"/>

  
      <!-- Status Bar -->
      <g transform="translate(0, 0)">
        <text x="32" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">9:41</text>
        <g transform="translate(325, 20)">
          <!-- Signal -->
          <rect x="0" y="8" width="3" height="4" rx="1" fill="#FFFFFF"/>
          <rect x="5" y="6" width="3" height="6" rx="1" fill="#FFFFFF"/>
          <rect x="10" y="3" width="3" height="9" rx="1" fill="#FFFFFF"/>
          <rect x="15" y="0" width="3" height="12" rx="1" fill="#FFFFFF"/>
          <!-- Battery -->
          <rect x="25" y="1" width="22" height="11" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
          <rect x="27" y="3" width="14" height="7" rx="1.5" fill="#FFFFFF"/>
          <path d="M48 4v5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </g>
    

  <g transform="translate(20, 56)">
    <rect width="36" height="36" rx="10" fill="#0A2540" stroke="#1E3A5F" stroke-width="1"/>
    <text x="18" y="23" font-family="Plus Jakarta Sans, sans-serif" font-size="16" fill="#D97706" text-anchor="middle">&larr;</text>
    <text x="175" y="24" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Instant Profile Setup</text>
  </g>

  <!-- Auto-creation Banner -->
  <g transform="translate(20, 110)">
    <rect width="350" height="54" rx="14" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <circle cx="28" cy="27" r="10" fill="#10B981"/>
    <text x="28" y="31" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#0A2540" text-anchor="middle">&check;</text>
    <text x="48" y="24" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#10B981">Profile Created via OTP Verification</text>
    <text x="48" y="40" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94A3B8">Your ID 9508125028087 is now your permanent login key.</text>
  </g>

  <!-- Profile Details Card -->
  <g transform="translate(20, 180)">
    <rect width="350" height="540" rx="20" fill="#061524" stroke="#1E3A5F" stroke-width="1.5"/>

    <g transform="translate(20, 24)">
      <text x="0" y="16" font-family="DM Serif Display, Georgia, serif" font-size="22" font-weight="bold" fill="#FFFFFF">Confirm Details</text>
      <text x="0" y="36" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#94A3B8">Auto-extracted from Home Affairs &amp; Credit Bureau</text>

      <!-- Fields -->
      <g transform="translate(0, 55)">
        <text x="0" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">LEGAL FULL NAME</text>
        <rect x="0" y="20" width="310" height="44" rx="10" fill="#0A2540" stroke="#1E3A5F" stroke-width="1"/>
        <text x="14" y="47" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Sindiwe Nomvula Dlamini</text>
      </g>

      <g transform="translate(0, 135)">
        <text x="0" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">EMPLOYMENT STATUS</text>
        <rect x="0" y="20" width="310" height="44" rx="10" fill="#0A2540" stroke="#1E3A5F" stroke-width="1"/>
        <text x="14" y="47" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#FFFFFF">Permanently Employed</text>
      </g>

      <g transform="translate(0, 215)">
        <text x="0" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">NET MONTHLY SALARY</text>
        <rect x="0" y="20" width="310" height="44" rx="10" fill="#0A2540" stroke="#D97706" stroke-width="1"/>
        <text x="14" y="47" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#D97706">R 9,500.00 / month</text>
        <text x="0" y="78" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#10B981">&check; Passes minimum R4,500 salary threshold</text>
      </g>

      <g transform="translate(0, 315)">
        <text x="0" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">PAYDAY DATE</text>
        <rect x="0" y="20" width="310" height="44" rx="10" fill="#0A2540" stroke="#1E3A5F" stroke-width="1"/>
        <text x="14" y="47" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#FFFFFF">25th of every month</text>
      </g>

      <!-- Continue Button -->
      <g transform="translate(0, 420)">
        <rect width="310" height="52" rx="14" fill="url(#gold3)"/>
        <text x="155" y="31" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#0A2540" text-anchor="middle">CONTINUE TO BANK CHECK &rarr;</text>
      </g>
    </g>
  </g>

  <rect x="135" y="828" width="120" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
</svg>
