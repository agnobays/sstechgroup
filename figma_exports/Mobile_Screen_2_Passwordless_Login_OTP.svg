<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="mBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05121F"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" rx="44" fill="url(#mBg2)"/>
  <rect width="390" height="844" rx="44" fill="none" stroke="#1E3A5F" stroke-width="3"/>

  
      <!-- Status Bar -->
      <g transform="translate(0, 0)">
        <text x="32" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">9:41</text>
        <g transform="translate(325, 20)">
          <!-- Signal -->
          <rect x="0" y="8" width="3" height="4" rx="1" fill="#FFFFFF"/>
          <rect x="5" y="6" width="3" height="6" rx="1" fill="#FFFFFF"/>
          <rect x="10" y="3" width="3" height="9" rx="1" fill="#FFFFFF"/>
          <rect x="15" y="0" width="3" height="12" rx="1" fill="#FFFFFF"/>
          <!-- Battery -->
          <rect x="25" y="1" width="22" height="11" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
          <rect x="27" y="3" width="14" height="7" rx="1.5" fill="#FFFFFF"/>
          <path d="M48 4v5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </g>
    

  <!-- Header Back & Title -->
  <g transform="translate(20, 56)">
    <rect width="36" height="36" rx="10" fill="#0A2540" stroke="#1E3A5F" stroke-width="1"/>
    <text x="18" y="23" font-family="Plus Jakarta Sans, sans-serif" font-size="16" fill="#D97706" text-anchor="middle">&larr;</text>
    <text x="175" y="24" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Borrower Login</text>
  </g>

  <!-- Login Description -->
  <g transform="translate(24, 120)">
    <rect width="48" height="48" rx="14" fill="#0A2540" stroke="#D97706" stroke-width="1.5"/>
    <text x="24" y="32" font-family="DM Serif Display, Georgia, serif" font-size="24" font-weight="bold" fill="#D97706" text-anchor="middle">Q</text>
    
    <text x="0" y="85" font-family="DM Serif Display, Georgia, serif" font-size="28" font-weight="bold" fill="#FFFFFF">Welcome Back</text>
    <text x="0" y="112" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#94A3B8">Enter your South African ID Number to sign in. No passwords needed &mdash; we send an instant secure OTP to your phone.</text>
  </g>

  <!-- Input Form -->
  <g transform="translate(24, 270)">
    <text x="0" y="14" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">SA ID NUMBER *</text>
    <rect x="0" y="24" width="342" height="52" rx="14" fill="#061524" stroke="#10B981" stroke-width="1.5"/>
    <text x="18" y="56" font-family="JetBrains Mono, monospace" font-size="17" font-weight="bold" fill="#FFFFFF">950812 5028 087</text>
    <text x="320" y="56" font-family="Plus Jakarta Sans, sans-serif" font-size="14" fill="#10B981" text-anchor="end">&check;</text>

    <!-- OTP Input Section -->
    <g transform="translate(0, 105)">
      <text x="0" y="14" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">ENTER 4-DIGIT ONE-TIME PIN (OTP)</text>
      <text x="0" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94A3B8">Sent to registered mobile 079 &bull;&bull;&bull; 9392</text>

      <!-- 4 PIN Boxes -->
      <g transform="translate(0, 42)">
        <rect x="0" y="0" width="68" height="56" rx="12" fill="#061524" stroke="#D97706" stroke-width="2"/>
        <text x="34" y="38" font-family="JetBrains Mono, monospace" font-size="24" font-weight="bold" fill="#D97706" text-anchor="middle">4</text>

        <rect x="91" y="0" width="68" height="56" rx="12" fill="#061524" stroke="#D97706" stroke-width="2"/>
        <text x="125" y="38" font-family="JetBrains Mono, monospace" font-size="24" font-weight="bold" fill="#D97706" text-anchor="middle">8</text>

        <rect x="182" y="0" width="68" height="56" rx="12" fill="#061524" stroke="#D97706" stroke-width="2"/>
        <text x="216" y="38" font-family="JetBrains Mono, monospace" font-size="24" font-weight="bold" fill="#D97706" text-anchor="middle">2</text>

        <rect x="274" y="0" width="68" height="56" rx="12" fill="#061524" stroke="#D97706" stroke-width="2"/>
        <text x="308" y="38" font-family="JetBrains Mono, monospace" font-size="24" font-weight="bold" fill="#D97706" text-anchor="middle">9</text>
      </g>

      <text x="171" y="125" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#D97706" text-anchor="middle">Resend OTP via SMS / WhatsApp (35s)</text>
    </g>

    <!-- Sign In Button -->
    <g transform="translate(0, 260)">
      <rect width="342" height="52" rx="14" fill="url(#gold2)"/>
      <text x="171" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#0A2540" text-anchor="middle">VERIFY &amp; ACCESS LOAN PORTAL &rarr;</text>
    </g>
  </g>

  <!-- Auto-registration note for first-timers -->
  <g transform="translate(24, 660)">
    <rect width="342" height="74" rx="14" fill="#061524" stroke="#1E3A5F" stroke-width="1"/>
    <text x="16" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">New Borrower?</text>
    <text x="16" y="46" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94A3B8">No need to pre-register. As soon as you complete your first loan application, your profile is created automatically!</text>
  </g>

  <rect x="135" y="828" width="120" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
</svg>
