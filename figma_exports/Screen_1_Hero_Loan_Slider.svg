<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05121F"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="880" fill="url(#bgGrad)"/>

  <!-- Top Navigation Header -->
  <g transform="translate(60, 40)">
    <!-- Header Card -->
    <rect width="1160" height="76" rx="16" fill="#0A2540" stroke="#1E3A5F" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Logo Symbol -->
    <rect x="20" y="16" width="44" height="44" rx="10" fill="url(#goldGrad)"/>
    <text x="42" y="47" font-family="DM Serif Display, Georgia, serif" font-size="26" font-weight="bold" fill="#0A2540" text-anchor="middle">Q</text>
    
    <!-- Logo Text -->
    <text x="76" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1">QHAWE</text>
    <text x="156" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#D97706" letter-spacing="2">CREDIT SOLUTIONS</text>
    <text x="76" y="54" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Automated Micro-Lending &bull; NCR Registered Provider</text>

    <!-- Right Header Badges -->
    <rect x="910" y="22" width="230" height="32" rx="8" fill="#05101A" stroke="#10B981" stroke-width="1"/>
    <circle cx="928" cy="38" r="4" fill="#10B981"/>
    <text x="940" y="42" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#10B981">15-Min Instant Payouts Active</text>
  </g>

  <!-- Progress Flow Bar -->
  <g transform="translate(60, 136)">
    <rect width="1160" height="48" rx="12" fill="#0A2540" stroke="#1E3A5F" stroke-width="1"/>
    
    <!-- Step 1 (Active) -->
    <circle cx="40" cy="24" r="12" fill="#D97706"/>
    <text x="40" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#0A2540" text-anchor="middle">1</text>
    <text x="60" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#D97706">1. Choose Loan Amount</text>

    <line x1="240" y1="24" x2="310" y2="24" stroke="#1E3A5F" stroke-width="2"/>

    <!-- Step 2 -->
    <circle cx="340" cy="24" r="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="340" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="middle">2</text>
    <text x="360" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">2. Identity &amp; Income</text>

    <line x1="520" y1="24" x2="590" y2="24" stroke="#1E3A5F" stroke-width="2"/>

    <!-- Step 3 -->
    <circle cx="620" cy="24" r="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="620" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="middle">3</text>
    <text x="640" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">3. Bank Verification</text>

    <line x1="790" y1="24" x2="860" y2="24" stroke="#1E3A5F" stroke-width="2"/>

    <!-- Step 4 -->
    <circle cx="890" cy="24" r="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="890" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="middle">4</text>
    <text x="910" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">4. DebiCheck &amp; Payout</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="640" y="225" font-family="DM Serif Display, Georgia, serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">How much cash do you need today?</text>
  <text x="640" y="252" font-family="Plus Jakarta Sans, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Automated 15-minute approvals capped at R5,000 for instant disbursement.</text>

  <!-- Main Calculator Grid -->
  <g transform="translate(60, 275)">
    <!-- Left Column: Slider Card -->
    <rect width="680" height="520" rx="20" fill="#0A2540" stroke="#1E3A5F" stroke-width="1.5" filter="url(#shadow)"/>

    <g transform="translate(40, 40)">
      <text x="0" y="16" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1">BORROW AMOUNT</text>
      
      <!-- Big Amount Display -->
      <text x="600" y="25" font-family="JetBrains Mono, monospace" font-size="44" font-weight="bold" fill="#D97706" text-anchor="end">R 2,500</text>

      <!-- Slider Track -->
      <rect x="0" y="70" width="600" height="12" rx="6" fill="#1E293B"/>
      <!-- Active fill track up to 2500 (approx 44%) -->
      <rect x="0" y="70" width="267" height="12" rx="6" fill="url(#goldGrad)"/>
      <!-- Slider Thumb -->
      <circle cx="267" cy="76" r="16" fill="#FFFFFF" stroke="#D97706" stroke-width="4" filter="url(#shadow)"/>

      <!-- Min / Cap / Max Markers -->
      <text x="0" y="112" font-family="JetBrains Mono, monospace" font-size="12" fill="#64748B">R 500 (Min)</text>
      <text x="267" y="112" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#D97706" text-anchor="middle">R 2,500 (1st-Time Cap)</text>
      <text x="600" y="112" font-family="JetBrains Mono, monospace" font-size="12" fill="#64748B" text-anchor="end">R 5,000 (Max Limit)</text>

      <!-- Repayment Term Section -->
      <text x="0" y="165" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1">REPAYMENT TERM</text>

      <!-- 3 Term Buttons -->
      <!-- 1 Month (Selected) -->
      <g transform="translate(0, 185)">
        <rect width="186" height="64" rx="14" fill="#0F2F50" stroke="#D97706" stroke-width="2"/>
        <text x="93" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">1 Month</text>
        <text x="93" y="48" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">30 Days</text>
      </g>

      <!-- 2 Months -->
      <g transform="translate(206, 185)">
        <rect width="186" height="64" rx="14" fill="#05101A" stroke="#1E3A5F" stroke-width="1"/>
        <text x="93" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">2 Months</text>
        <text x="93" y="48" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">60 Days</text>
      </g>

      <!-- 3 Months -->
      <g transform="translate(414, 185)">
        <rect width="186" height="64" rx="14" fill="#05101A" stroke="#1E3A5F" stroke-width="1"/>
        <text x="93" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">3 Months</text>
        <text x="93" y="48" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">90 Days</text>
      </g>

      <!-- Features Box -->
      <g transform="translate(0, 290)">
        <rect width="600" height="135" rx="14" fill="#05101A" stroke="#1E3A5F" stroke-width="1"/>
        
        <g transform="translate(30, 30)">
          <text x="0" y="16" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">
            <tspan fill="#10B981" font-weight="bold">&check;  </tspan>100% Online Paperless Application
          </text>
          <text x="0" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">
            <tspan fill="#10B981" font-weight="bold">&check;  </tspan>Direct RTC Payout into your Bank Account
          </text>
          <text x="320" y="16" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">
            <tspan fill="#10B981" font-weight="bold">&check;  </tspan>NCA Statutory Fee Caps Guaranteed
          </text>
          <text x="320" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">
            <tspan fill="#10B981" font-weight="bold">&check;  </tspan>DebiCheck Secure Mandate Protection
          </text>
        </g>
      </g>
    </g>

    <!-- Right Column: LendPlus Cost Breakdown Card -->
    <g transform="translate(710, 0)">
      <rect width="450" height="520" rx="20" fill="#05121F" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(35, 35)">
        <text x="0" y="16" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1">COST BREAKDOWN</text>
        <rect x="270" y="0" width="110" height="24" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
        <text x="325" y="16" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" fill="#10B981" text-anchor="middle">NCA COMPLIANT</text>

        <line x1="0" y1="36" x2="380" y2="36" stroke="#1E3A5F" stroke-width="1"/>

        <!-- Breakdown Items -->
        <g transform="translate(0, 56)">
          <text x="0" y="15" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94A3B8">Principal Borrowed:</text>
          <text x="380" y="15" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="end">R 2,500.00</text>

          <text x="0" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94A3B8">Initiation Fee (statutory):</text>
          <text x="380" y="45" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="end">R 315.00</text>

          <text x="0" y="75" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94A3B8">Monthly Service Fee:</text>
          <text x="380" y="75" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="end">R 69.00</text>

          <text x="0" y="105" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94A3B8">Monthly Interest (5% NCA):</text>
          <text x="380" y="105" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="end">R 125.00</text>

          <text x="0" y="135" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94A3B8">Credit Life Insurance:</text>
          <text x="380" y="135" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="end">R 28.50</text>
        </g>

        <!-- Total Box -->
        <g transform="translate(0, 220)">
          <rect width="380" height="88" rx="12" fill="#0A2540" stroke="#1E3A5F" stroke-width="1"/>
          <text x="20" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" letter-spacing="1">TOTAL REPAYABLE</text>
          <text x="20" y="68" font-family="JetBrains Mono, monospace" font-size="32" font-weight="bold" fill="#D97706">R 3,037.50</text>

          <text x="360" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">Due Date</text>
          <text x="360" y="55" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">25 Nov 2026</text>
        </g>

        <!-- CTA Button -->
        <g transform="translate(0, 340)">
          <rect width="380" height="58" rx="14" fill="url(#goldGrad)" filter="url(#shadow)"/>
          <text x="190" y="35" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#0A2540" text-anchor="middle">APPLY FOR R 2,500 IN 5 MINS &rarr;</text>
        </g>

        <!-- Footer trust -->
        <text x="190" y="425" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">No upfront fees &bull; Instant RSA ID Check &bull; POPIA Compliant</text>
      </g>
    </g>
  </g>
</svg>
