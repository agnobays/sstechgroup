      <circle cx="32" cy="40" r="16" fill="#1E3A5F"/>
      <text x="32" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">T</text>
      <text x="60" y="36" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">TymeBank</text>
