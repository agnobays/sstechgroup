      <text x="72" y="20" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" fill="#10B981" text-anchor="middle">&check; TransUnion Clear</text>

      <rect x="160" y="0" width="150" height="30" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
      <text x="235" y="20" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" fill="#10B981" text-anchor="middle">&check; Affordability OK</text>
    </g>
    <text x="20" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748B">&bull; Protected by PASA (Payments Association of South Africa)</text>
