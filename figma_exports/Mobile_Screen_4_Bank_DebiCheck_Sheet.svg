      <text x="60" y="36" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Absa</text>
      <text x="60" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748B">Instant verify</text>
